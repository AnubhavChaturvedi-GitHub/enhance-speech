<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enhance Speech | AI filter for cleaning up spoken audio</title>
  <meta name="description" content="This AI audio filter improves spoken audio to make it sound like it was recorded in a soundproofed studio. Runs on your own computer.">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/" aria-label="Enhance Speech home">
      <img src="assets/mark.svg" alt="" width="40" height="40">
      <span>Enhance Speech</span>
    </a>
    <nav class="main-nav" aria-label="Main">
      <a href="#/enhance">Enhance</a>
      <a href="#/features">Features</a>
    </nav>
    <a class="pill-button header-cta" href="#/enhance">Open workspace</a>
  </header>
  <main id="view"></main>
  <input type="file" id="file-input" accept="audio/*,video/*,.wav,.mp3,.m4a,.aac,.flac,.ogg,.opus,.aiff,.mp4,.mov,.m4v,.webm,.mkv" multiple hidden aria-label="Choose files">
  <div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
